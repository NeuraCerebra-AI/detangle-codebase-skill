<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Detangle Codebase review-first path from tangled to clear</title>
  <desc id="desc">A vertical diagram shows a tangled codebase, a read-only review, and a clear codebase with one owner and one canonical path. Changes require explicit approval.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace; }
  </style>

  <rect width="640" height="820" rx="28" fill="#0d1117"/>
  <rect x="1" y="1" width="638" height="818" rx="27" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="48" y="68" class="sans" fill="#f0f6fc" font-size="42" font-weight="750">Detangle Codebase</text>
  <text x="48" y="102" class="sans" fill="#c9d1d9" font-size="22">Review first. Change with care.</text>
  <rect x="48" y="126" width="544" height="42" rx="11" fill="#13233a" stroke="#388bfd"/>
  <circle cx="73" cy="147" r="6" fill="#58a6ff"/>
  <text x="92" y="154" class="sans" fill="#b6daff" font-size="18" font-weight="650">Changes need explicit approval.</text>

  <rect x="48" y="208" width="544" height="130" rx="18" fill="#161b22" stroke="#3d444d" stroke-width="2"/>
  <circle cx="83" cy="252" r="18" fill="#302109" stroke="#d29922" stroke-width="2"/>
  <text x="83" y="259" class="sans" text-anchor="middle" fill="#f8e3ad" font-size="21" font-weight="750">1</text>
  <text x="120" y="256" class="sans" fill="#f0f6fc" font-size="30" font-weight="750">Tangled</text>
  <text x="120" y="288" class="sans" fill="#c9d1d9" font-size="21">Duplicate paths. Unclear owners.</text>
  <g fill="none" stroke-linecap="round" stroke-width="6">
    <path d="M390 249C421 223 438 302 473 256S529 231 555 289" stroke="#58a6ff"/>
    <path d="M390 289C423 314 456 226 490 279S534 300 558 240" stroke="#3fb950"/>
    <path d="M391 236C430 257 418 304 462 293S516 229 555 258" stroke="#bc8cff"/>
  </g>

  <path d="M83 338V379" stroke="#58a6ff" stroke-width="4"/>
  <path d="M72 368L83 380L94 368" fill="none" stroke="#58a6ff" stroke-width="4"/>

  <rect x="48" y="390" width="544" height="130" rx="18" fill="#111b29" stroke="#388bfd" stroke-width="2"/>
  <circle cx="83" cy="434" r="18" fill="#13233a" stroke="#388bfd" stroke-width="2"/>
  <text x="83" y="441" class="sans" text-anchor="middle" fill="#b6daff" font-size="21" font-weight="750">2</text>
  <text x="120" y="438" class="sans" fill="#f0f6fc" font-size="30" font-weight="750">Review first</text>
  <text x="120" y="464" class="sans" fill="#c9d1d9" font-size="21">Find the real path.</text>
  <text x="120" y="492" class="sans" fill="#c9d1d9" font-size="21">Name the owner.</text>
  <rect x="415" y="416" width="142" height="66" rx="12" fill="#161b22" stroke="#388bfd"/>
  <text x="486" y="443" class="mono" text-anchor="middle" fill="#b6daff" font-size="16">read-only</text>
  <text x="486" y="466" class="mono" text-anchor="middle" fill="#dbeafe" font-size="16">evidence</text>

  <path d="M83 520V561" stroke="#3fb950" stroke-width="4"/>
  <path d="M72 550L83 562L94 550" fill="none" stroke="#3fb950" stroke-width="4"/>

  <rect x="48" y="572" width="544" height="130" rx="18" fill="#10251a" stroke="#2ea043" stroke-width="2"/>
  <circle cx="83" cy="616" r="18" fill="#16351f" stroke="#3fb950" stroke-width="2"/>
  <text x="83" y="623" class="sans" text-anchor="middle" fill="#a7f3b7" font-size="21" font-weight="750">3</text>
  <text x="120" y="620" class="sans" fill="#f0f6fc" font-size="30" font-weight="750">Clear codebase</text>
  <text x="120" y="652" class="sans" fill="#c9d1d9" font-size="21">One owner. One canonical path.</text>
  <path d="M488 604V659" stroke="#3fb950" stroke-width="4"/>
  <circle cx="488" cy="604" r="8" fill="#3fb950"/>
  <rect x="510" y="635" width="56" height="34" rx="8" fill="#13233a" stroke="#388bfd"/>

  <path d="M48 750H592" stroke="#30363d"/>
  <text x="320" y="787" class="sans" text-anchor="middle" fill="#8b949e" font-size="20">Read-only first. Changes need approval.</text>
</svg>
