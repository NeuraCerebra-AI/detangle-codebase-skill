<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Detangle Codebase turns a tangled app into a codebase with clear ownership</title>
  <desc id="desc">A dark three-part diagram shows Detangle Codebase reviewing crossing paths in a tangled app, finding the real path, naming the owner, and planning safely before producing a clear codebase with one owner and one canonical path.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    .flow { stroke-dasharray: 8 12; animation: move 1.8s linear infinite; }
    @keyframes move { to { stroke-dashoffset: -40; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; } }
  </style>

  <rect width="1200" height="460" rx="28" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="458" rx="27" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="58" y="68" class="sans" fill="#f0f6fc" font-size="44" font-weight="750">Detangle Codebase</text>
  <text x="58" y="105" class="sans" fill="#c9d1d9" font-size="21">Review first. Clarify ownership. Change with care.</text>

  <rect x="768" y="45" width="374" height="48" rx="12" fill="#13233a" stroke="#388bfd"/>
  <circle cx="795" cy="69" r="6" fill="#58a6ff"/>
  <text x="816" y="76" class="sans" fill="#b6daff" font-size="17" font-weight="600">Read-only first. Changes require approval.</text>

  <path d="M58 132H1142" stroke="#30363d"/>

  <rect x="58" y="164" width="300" height="238" rx="20" fill="#161b22" stroke="#3d444d" stroke-width="2"/>
  <text x="84" y="199" class="sans" fill="#f0f6fc" font-size="21" font-weight="700">Tangled app</text>

  <g fill="none" stroke-linecap="round" stroke-width="6">
    <path d="M92 275C135 231 181 351 232 281S301 251 328 302" stroke="#58a6ff"/>
    <path d="M91 328C135 367 180 246 230 319S292 359 330 276" stroke="#3fb950"/>
    <path d="M93 249C157 278 136 364 204 346S260 236 328 257" stroke="#bc8cff"/>
    <path d="M91 352C151 317 193 335 226 290S282 298 329 238" stroke="#e3b341"/>
  </g>
  <g fill="#0d1117" stroke-width="4">
    <circle cx="93" cy="249" r="9" stroke="#bc8cff"/>
    <circle cx="143" cy="323" r="9" stroke="#58a6ff"/>
    <circle cx="211" cy="320" r="9" stroke="#3fb950"/>
    <circle cx="267" cy="300" r="9" stroke="#e3b341"/>
    <circle cx="328" cy="257" r="9" stroke="#bc8cff"/>
  </g>

  <path d="M374 282H418" stroke="#58a6ff" stroke-width="4"/>
  <path d="M405 271L420 282L405 293" fill="none" stroke="#58a6ff" stroke-width="4"/>
  <path d="M374 282H418" class="flow" stroke="#b6daff" stroke-width="3"/>

  <rect x="420" y="164" width="360" height="238" rx="20" fill="#111b29" stroke="#388bfd" stroke-width="2"/>
  <text x="446" y="199" class="sans" fill="#f0f6fc" font-size="21" font-weight="700">Review first</text>

  <rect x="446" y="236" width="308" height="44" rx="10" fill="#161b22" stroke="#388bfd"/>
  <circle cx="469" cy="258" r="6" fill="#58a6ff"/>
  <text x="490" y="265" class="sans" fill="#dbeafe" font-size="17">Find real path</text>
  <rect x="446" y="294" width="308" height="44" rx="10" fill="#161b22" stroke="#2ea043"/>
  <circle cx="469" cy="316" r="6" fill="#3fb950"/>
  <text x="490" y="323" class="sans" fill="#d7f8df" font-size="17">Name owner</text>
  <rect x="446" y="352" width="308" height="44" rx="10" fill="#161b22" stroke="#d29922"/>
  <circle cx="469" cy="374" r="6" fill="#e3b341"/>
  <text x="490" y="381" class="sans" fill="#f8e3ad" font-size="17">Plan safely</text>

  <path d="M796 282H840" stroke="#3fb950" stroke-width="4"/>
  <path d="M827 271L842 282L827 293" fill="none" stroke="#3fb950" stroke-width="4"/>
  <path d="M796 282H840" class="flow" stroke="#7ee787" stroke-width="3"/>

  <rect x="842" y="164" width="300" height="238" rx="20" fill="#10251a" stroke="#2ea043" stroke-width="2"/>
  <text x="868" y="199" class="sans" fill="#f0f6fc" font-size="21" font-weight="700">Clear codebase</text>

  <rect x="930" y="238" width="124" height="46" rx="11" fill="#16351f" stroke="#3fb950" stroke-width="2"/>
  <text x="992" y="267" class="sans" text-anchor="middle" fill="#a7f3b7" font-size="17" font-weight="700">One owner</text>
  <path d="M992 284V326" stroke="#3fb950" stroke-width="4"/>
  <circle cx="992" cy="326" r="6" fill="#3fb950"/>
  <path d="M992 326V347" stroke="#3fb950" stroke-width="4"/>
  <rect x="897" y="347" width="190" height="44" rx="11" fill="#13233a" stroke="#388bfd" stroke-width="2"/>
  <text x="992" y="375" class="sans" text-anchor="middle" fill="#b6daff" font-size="17" font-weight="650">Canonical path</text>
</svg>
