<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Detangle Codebase workflow</title>
  <desc id="desc">A vertical four-step workflow moves from read-only evidence through plan comparison and challenge to carefully authorized execution that leaves one clear canonical path.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace; }
  </style>

  <rect width="640" height="1080" rx="28" fill="#0d1117"/>
  <rect x="1" y="1" width="638" height="1078" rx="27" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="48" y="65" class="sans" fill="#f0f6fc" font-size="39" font-weight="750">Detangle Codebase workflow</text>
  <text x="48" y="98" class="sans" fill="#c9d1d9" font-size="21">Review first. Execute only through an explicit local gate.</text>
  <path d="M48 125H592" stroke="#30363d"/>

  <path d="M83 187V847" stroke="#30363d" stroke-width="5" stroke-linecap="round"/>

  <circle cx="83" cy="187" r="22" fill="#13233a" stroke="#388bfd" stroke-width="2"/>
  <text x="83" y="195" class="sans" text-anchor="middle" fill="#b6daff" font-size="21" font-weight="750">1</text>
  <rect x="130" y="138" width="462" height="150" rx="18" fill="#111b29" stroke="#388bfd" stroke-width="2"/>
  <text x="158" y="184" class="sans" fill="#f0f6fc" font-size="30" font-weight="750">Review evidence</text>
  <text x="158" y="217" class="sans" fill="#c9d1d9" font-size="21">Map owners, paths, constraints, and</text>
  <text x="158" y="244" class="sans" fill="#c9d1d9" font-size="21">the behavior that must not break.</text>
  <text x="158" y="270" class="mono" fill="#79c0ff" font-size="17">read-only</text>

  <circle cx="83" cy="390" r="22" fill="#13233a" stroke="#388bfd" stroke-width="2"/>
  <text x="83" y="398" class="sans" text-anchor="middle" fill="#b6daff" font-size="21" font-weight="750">2</text>
  <rect x="130" y="341" width="462" height="150" rx="18" fill="#10251a" stroke="#2ea043" stroke-width="2"/>
  <text x="158" y="387" class="sans" fill="#f0f6fc" font-size="30" font-weight="750">Compare options</text>
  <text x="158" y="420" class="sans" fill="#c9d1d9" font-size="21">Choose one defensible architecture</text>
  <text x="158" y="447" class="sans" fill="#c9d1d9" font-size="21">and freeze a practical plan.</text>
  <text x="158" y="473" class="mono" fill="#7ee787" font-size="17">one selected path</text>

  <circle cx="83" cy="593" r="22" fill="#211637" stroke="#bc8cff" stroke-width="2"/>
  <text x="83" y="601" class="sans" text-anchor="middle" fill="#d2a8ff" font-size="21" font-weight="750">3</text>
  <rect x="130" y="544" width="462" height="150" rx="18" fill="#211637" stroke="#8957e5" stroke-width="2"/>
  <text x="158" y="590" class="sans" fill="#f0f6fc" font-size="30" font-weight="750">Challenge the plan</text>
  <text x="158" y="623" class="sans" fill="#c9d1d9" font-size="21">Test assumptions and surface risks</text>
  <text x="158" y="650" class="sans" fill="#c9d1d9" font-size="21">before any local changes begin.</text>
  <text x="158" y="676" class="mono" fill="#d2a8ff" font-size="17">adversarial review</text>

  <circle cx="83" cy="796" r="22" fill="#16351f" stroke="#3fb950" stroke-width="2"/>
  <text x="83" y="804" class="sans" text-anchor="middle" fill="#a7f3b7" font-size="21" font-weight="750">4</text>
  <rect x="130" y="747" width="462" height="150" rx="18" fill="#10251a" stroke="#2ea043" stroke-width="2"/>
  <text x="158" y="793" class="sans" fill="#f0f6fc" font-size="30" font-weight="750">Execute carefully</text>
  <text x="158" y="826" class="sans" fill="#c9d1d9" font-size="21">Use the contract, isolated Git state,</text>
  <text x="158" y="853" class="sans" fill="#c9d1d9" font-size="21">validation, and safe subtraction.</text>
  <text x="158" y="879" class="mono" fill="#a7f3b7" font-size="17">explicit approval required</text>

  <path d="M48 950H592" stroke="#30363d"/>
  <rect x="48" y="978" width="544" height="54" rx="13" fill="#13233a" stroke="#388bfd"/>
  <text x="320" y="1012" class="sans" text-anchor="middle" fill="#b6daff" font-size="21" font-weight="700">One owner. One canonical path.</text>
</svg>
